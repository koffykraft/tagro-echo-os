AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TAGRO ECHO OS WO-0012 NonProd governed runtime boundary

Parameters:
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  DbSecretArn:
    Type: String
  DbHost:
    Type: String
  DbName:
    Type: String
    Default: echoos
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  EchoHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      Auth:
        DefaultAuthorizer: EchoStaffJwt
        Authorizers:
          EchoStaffJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'
              audience:
                - !Ref UserPoolClientId

  EchoRuntimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: echo-nonprod-runtime
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: src.aws_runtime.handler.lambda_handler
      CodeUri: ../..
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          ECHO_ENV: nonprod
          DB_SECRET_ARN: !Ref DbSecretArn
          DB_HOST: !Ref DbHost
          DB_PORT: '5432'
          DB_NAME: !Ref DbName
      VpcConfig:
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Sid: ReadOnlyRdsMasterSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbSecretArn
      Events:
        PublicHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref EchoHttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        WhoAmI:
          Type: HttpApi
          Properties:
            ApiId: !Ref EchoHttpApi
            Path: /whoami
            Method: GET
        DatabaseHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref EchoHttpApi
            Path: /db-health
            Method: GET

Outputs:
  HttpApiId:
    Value: !Ref EchoHttpApi
  HttpApiEndpoint:
    Value: !Sub 'https://${EchoHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  LambdaFunctionName:
    Value: !Ref EchoRuntimeFunction
