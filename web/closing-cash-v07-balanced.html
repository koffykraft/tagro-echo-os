<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<title>TAGRO ECHO · Closing Cash Ver07 Balanced</title>
<style>
:root{--ink:#171717;--line:#222;--sale:#c8f3c8;--expense:#fff486;--cash:#d5f4d0;--grey:#d3d3d3;--focus:#4b9cff;--yellow:#fff349;--red:#e53935;--blue:#2368d5;--soft:#f5f5f2}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.page{max-width:1180px;margin:0 auto;padding:8px 10px 14px}.topline{display:flex;align-items:end;justify-content:space-between;gap:10px}.brand{font-size:20px;font-weight:900}.sub{font-size:11px;color:#666}.meta{display:grid;grid-template-columns:150px 90px 220px 1fr;gap:6px;align-items:end;margin-top:5px}.meta label{font-size:9px;color:#666}.meta input,.meta select{width:100%;height:29px;border:1px solid #aaa;border-radius:3px;background:#fff;padding:2px 5px;font-size:11px}.tools{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.tools button{height:29px;border:1px solid #999;background:#fff;border-radius:3px;padding:3px 8px;font-weight:700;font-size:10px}.tools .save{background:#e85d22;color:#fff;border-color:#e85d22}.workspace{display:grid;grid-template-columns:minmax(0,720px) 1fr;gap:8px;margin-top:7px;align-items:start}.sheetbox,.sidebox{border:1px solid #bbb;background:#fff}.grid{width:100%;border-collapse:collapse;table-layout:fixed}.grid col.sale{width:110px}.grid col.bill{width:120px}.grid col.exp{width:120px}.grid col.part{width:auto}.grid th,.grid td{border:1px solid var(--line);height:27px;padding:0}.grid th{height:28px;font-size:10px;text-align:center;background:#fff}.grid th.sale,.grid td.sale{background:var(--sale)}.grid th.exp,.grid td.exp{background:var(--expense)}.grid input{width:100%;height:26px;border:0;background:transparent;padding:2px 5px;outline:0;font-size:11px}.grid input.num{text-align:right}.grid tr.active td{box-shadow:inset 0 1px var(--focus),inset 0 -1px var(--focus)}.grid input:focus{box-shadow:inset 0 0 0 2px var(--focus);background:rgba(255,255,255,.45)}.sheet-note{font-size:8px;color:#666;padding:3px 5px;border-top:1px solid #bbb}.sidewrap{display:grid;grid-template-columns:1fr;gap:8px}.sidebox h3{font-size:10px;margin:0;padding:4px 6px;border-bottom:1px solid #bbb}.denom{width:100%;border-collapse:collapse}.denom td,.denom th{border:1px solid var(--line);height:25px;padding:0}.denom th{font-size:8px;background:#eee}.denom td:first-child,.denom td:last-child{background:var(--cash);font-weight:700;padding:0 4px;text-align:right}.denom input{width:100%;height:24px;border:0;background:var(--grey);text-align:right;padding:1px 4px;outline:0;font-size:10px}.denom input:focus{box-shadow:inset 0 0 0 2px var(--focus)}.summary{display:grid;grid-template-columns:1fr 80px}.summary div{border-bottom:1px solid var(--line);padding:4px 5px;min-height:25px;font-size:10px}.summary div:nth-child(2n){border-left:1px solid var(--line);text-align:right;font-weight:700}.summary .blue{color:var(--blue);font-weight:800}.summary .diff{background:var(--yellow);color:var(--red);font-weight:900}.hint{font-size:8px;color:#666;margin-top:4px}.desktop-only{display:block}.mobile-only{display:none}
@media(max-width:760px){html,body{font-size:12px}.page{max-width:none;padding:5px}.brand{font-size:17px}.sub{font-size:9px}.meta{grid-template-columns:1fr 74px 1.2fr;gap:4px}.meta input,.meta select{height:30px;font-size:11px}.tools{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.tools button{white-space:nowrap}.workspace{display:block;margin-top:5px}.sidewrap{grid-template-columns:1fr 1.05fr;gap:4px;margin-top:4px}.grid col.sale{width:21%}.grid col.bill{width:22%}.grid col.exp{width:22%}.grid col.part{width:35%}.grid th,.grid td{height:33px}.grid th{font-size:10px}.grid input{height:32px;font-size:12px;padding:3px 4px}.sheet-note{font-size:8px}.denom td,.denom th{height:29px}.denom input{height:28px;font-size:11px}.summary{grid-template-columns:1fr 68px}.summary div{min-height:29px;font-size:10px;padding:4px}.desktop-only{display:none}.mobile-only{display:block}}
</style>
</head>
<body>
<div class="page">
<div class="topline"><div><div class="brand">TAGRO × ECHO · Closing Cash</div><div class="sub">Ver07 · Excel-inspired balanced entry</div></div></div>
<div class="meta"><label>Date<input id="date" type="date"></label><label>Branch<select id="branch"><option>KVR</option><option>PKM</option><option>NDD</option><option>MDM</option><option>SKT</option></select></label><label>Entered by<select id="person"><option>Login user</option><option>Owner</option></select></label><div></div></div>
<div class="tools"><button id="saleMode">SALE</button><button id="expenseMode">EXPENSE</button><button id="cashMode">CASH / OTHER</button><button id="undo">Undo</button><button class="save" id="review">Review & Save</button></div>
<div class="workspace"><div class="sheetbox"><table class="grid"><colgroup><col class="sale"><col class="bill"><col class="exp"><col class="part"></colgroup><thead><tr><th class="sale">SALE</th><th>BILL</th><th class="exp">EXPENSES</th><th>PARTICULARS</th></tr></thead><tbody id="rows"></tbody></table><div class="sheet-note">All entry cells are text fields. ENTER/Next follows the current job path.</div></div><div class="sidewrap"><div class="sidebox"><h3>CASH COUNT</h3><table class="denom"><thead><tr><th>Note</th><th>Qty</th><th>Amount</th></tr></thead><tbody id="denoms"></tbody></table></div><div class="sidebox"><h3>CLOSING</h3><div class="summary" id="summary"></div></div></div></div>
<div class="hint" id="hint">SALE: amount → bill → next row.</div></div>
<script>
const DENOMS=[500,200,100,50,20,10,'Coins'];let mode='sale',data=[],counts={500:'0',200:'0',100:'0',50:'0',20:'0',10:'0',Coins:'0'},active=null,lastAdded=null;const $=id=>document.getElementById(id);function n(v){const x=Number(String(v??'').replace(/,/g,'').trim());return Number.isFinite(x)?x:0}function today(){const d=new Date(),p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addRow(seed={}){const r={id:crypto.randomUUID(),sale:String(seed.sale||''),bill:String(seed.bill||''),expense:String(seed.expense||''),part:String(seed.part||'')};data.push(r);lastAdded=r.id;renderRows();return r}
function renderRows(){rows.innerHTML=data.map(r=>`<tr data-row="${r.id}"><td class="sale"><input class="num" type="text" data-id="${r.id}" data-key="sale" enterkeyhint="next" autocomplete="off" value="${esc(r.sale)}"></td><td><input type="text" data-id="${r.id}" data-key="bill" enterkeyhint="next" autocomplete="off" value="${esc(r.bill)}"></td><td class="exp"><input class="num" type="text" data-id="${r.id}" data-key="expense" enterkeyhint="next" autocomplete="off" value="${esc(r.expense)}"></td><td><input type="text" data-id="${r.id}" data-key="part" enterkeyhint="next" autocomplete="off" value="${esc(r.part)}"></td></tr>`).join('');rows.querySelectorAll('input').forEach(bindCell);calc()}
function bindCell(el){el.addEventListener('focus',()=>{active=el;rows.querySelectorAll('tr.active').forEach(x=>x.classList.remove('active'));el.closest('tr').classList.add('active');requestAnimationFrame(()=>{try{el.select()}catch{}})});el.addEventListener('click',()=>{try{el.select()}catch{}});el.addEventListener('input',()=>{const r=data.find(x=>x.id===el.dataset.id);r[el.dataset.key]=el.value;calc()});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();advance(e.shiftKey?-1:1)}else if(e.key==='ArrowDown'){e.preventDefault();moveVertical(1)}else if(e.key==='ArrowUp'){e.preventDefault();moveVertical(-1)}})}
function pathFor(){return mode==='sale'?['sale','bill']:['expense','part']}
function advance(dir=1){if(!active){focusMode();return}const ri=data.findIndex(r=>r.id===active.dataset.id),key=active.dataset.key,path=pathFor(),pi=path.indexOf(key);if(pi<0){focusMode();return}if(dir<0){if(pi>0)return focus(data[ri].id,path[pi-1]);if(ri>0)return focus(data[ri-1].id,path[path.length-1]);return}if(pi<path.length-1)return focus(data[ri].id,path[pi+1]);let next=data[ri+1];if(!next)next=addRow();focus(next.id,path[0])}
function moveVertical(dir){if(!active)return;const i=data.findIndex(r=>r.id===active.dataset.id),ni=Math.max(0,Math.min(data.length-1,i+dir));focus(data[ni].id,active.dataset.key)}
function focus(id,key){const el=rows.querySelector(`input[data-id="${id}"][data-key="${key}"]`);if(el){el.focus({preventScroll:true});try{el.select()}catch{}el.scrollIntoView({block:'nearest'})}}
function focusMode(){if(!data.length)addRow();focus(data[0].id,mode==='sale'?'sale':'expense')}
function setMode(m){mode=m;hint.textContent=m==='sale'?'SALE: amount → bill → next row.':m==='expense'?'EXPENSE: amount → particulars → next row.':'CASH / OTHER: amount → particulars → next row.';focusMode()}
function renderDenoms(){denoms.innerHTML=DENOMS.map(d=>`<tr><td>${d==='Coins'?'Coins':'₹'+d}</td><td><input type="text" data-denom="${d}" enterkeyhint="next" autocomplete="off" value="${counts[d]}"></td><td data-amount="${d}">${d==='Coins'?n(counts[d]):n(d)*n(counts[d])}</td></tr>`).join('');const ins=[...denoms.querySelectorAll('input')];ins.forEach((el,i)=>{el.addEventListener('focus',()=>requestAnimationFrame(()=>{try{el.select()}catch{}}));el.addEventListener('click',()=>{try{el.select()}catch{}});el.addEventListener('input',()=>{counts[el.dataset.denom]=el.value;denoms.querySelector(`[data-amount="${el.dataset.denom}"]`).textContent=el.dataset.denom==='Coins'?n(el.value):n(el.dataset.denom)*n(el.value);calc()});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();const t=ins[e.shiftKey?Math.max(0,i-1):Math.min(ins.length-1,i+1)];t.focus({preventScroll:true});try{t.select()}catch{}}})})}
function calc(){const sales=data.reduce((s,r)=>s+n(r.sale),0),expenses=data.reduce((s,r)=>s+n(r.expense),0),yesterday=n(localStorage.getItem(`echo.cc.yesterday.${branch.value}`)||0),total=yesterday+sales,balance=total-expenses,cash=DENOMS.reduce((s,d)=>s+(d==='Coins'?n(counts[d]):n(d)*n(counts[d])),0),diff=cash-balance;summary.innerHTML=`<div>Yesterday Closing</div><div>${yesterday.toFixed(2)}</div><div>Today sale</div><div>${sales.toFixed(2)}</div><div><b>TOTAL</b></div><div>${total.toFixed(2)}</div><div>Expenses</div><div>${expenses.toFixed(2)}</div><div class="blue">Balance Due</div><div class="blue">${balance.toFixed(2)}</div><div><b>CASH in hand</b></div><div>${cash.toFixed(2)}</div><div class="diff">Difference</div><div class="diff">${diff.toFixed(2)}</div>`}
date.value=today();for(let i=0;i<10;i++)addRow();renderDenoms();saleMode.onclick=()=>setMode('sale');expenseMode.onclick=()=>setMode('expense');cashMode.onclick=()=>setMode('cash');undo.onclick=()=>{if(lastAdded&&data.length>1){data=data.filter(r=>r.id!==lastAdded);lastAdded=null;renderRows()}};review.onclick=()=>alert('Ver07 balanced render prototype.');branch.onchange=calc;
</script>
</body>
</html>
