<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAGRO ECHO OS · Closing Cash</title><link rel="stylesheet" href="styles.css"></head><body><header><div><b>TAGRO × ECHO · CLOSING CASH</b><small>Local prototype</small></div><a href="index.html">← OS</a></header><main><div class="notice"><b>Independent cash record.</b> This page records declared cash and variance; it does not infer bank deposit or accounting posting.</div><div class="card"><h1>Close cash</h1><div class="row"><label>Counter<select id="branch"></select></label><label>Business date<input id="date" type="date"></label></div><div class="row"><label>Opening<input id="opening" type="number" min="0" step="0.01"></label><label>Cash sales<input id="sales" type="number" min="0" step="0.01"></label><label>Other cash in<input id="other" type="number" min="0" step="0.01"></label></div><div class="row"><label>Cash expenses<input id="expenses" type="number" min="0" step="0.01"></label><label>Deposits/transfers<input id="deposits" type="number" min="0" step="0.01"></label><label>Declared closing<input id="declared" type="number" min="0" step="0.01"></label></div><label>Note<input id="note"></label><div class="actions"><button class="orange" id="save">Record closing</button></div></div><h2>Recent closings</h2><div id="list"></div></main><script>const key='tagro-echo-os-prototype-v1';let s=JSON.parse(localStorage.getItem(key)||'{}');s.branches=s.branches||[];s.cashClosings=s.cashClosings||[];const $=x=>document.querySelector(x),id=p=>p+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16),num=x=>Number($(x).value||0),save=()=>localStorage.setItem(key,JSON.stringify(s));function render(){ $('#branch').innerHTML='<option value="">Select</option>'+s.branches.map(x=>`<option value="${x.branch_id}">${x.code} · ${x.name}</option>`).join('');$('#date').value=$('#date').value||new Date().toISOString().slice(0,10);$('#list').innerHTML=s.cashClosings.slice().reverse().map(c=>`<div class="card"><h3>${c.business_date} · ${c.branch_id}</h3><p>Declared ₹${c.declared_closing.toFixed(2)} · Expected ₹${c.expected_closing.toFixed(2)} · <b>Variance ₹${c.variance.toFixed(2)}</b></p></div>`).join('')||'<p class="muted">No closings yet.</p>'}$('#save').onclick=()=>{const branch_id=$('#branch').value,business_date=$('#date').value,opening=num('#opening'),cash_sales=num('#sales'),other_cash_in=num('#other'),cash_expenses=num('#expenses'),cash_deposits_or_transfers=num('#deposits'),declared_closing=num('#declared');if(!branch_id||!business_date)return alert('Counter and date are required.');if([opening,cash_sales,other_cash_in,cash_expenses,cash_deposits_or_transfers,declared_closing].some(x=>x<0))return alert('Cash values cannot be negative.');const expected_closing=opening+cash_sales+other_cash_in-cash_expenses-cash_deposits_or_transfers;s.cashClosings.push({closing_id:id('cash'),branch_id,business_date,opening_cash:opening,cash_sales,other_cash_in,cash_expenses,cash_deposits_or_transfers,declared_closing,expected_closing,variance:declared_closing-expected_closing,recorded_at:new Date().toISOString(),note:$('#note').value.trim()});save();render()};render();</script></body></html>
