<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAGRO ECHO OS · Payments</title><link rel="stylesheet" href="styles.css"></head><body><header><div><b>TAGRO × ECHO</b><small>Payments · local prototype</small></div><a href="index.html">← OS</a></header><main><div class="notice"><b>Evidence boundary:</b> payment records remain separate from sales and bank transactions until explicitly allocated/matched.</div><div class="card"><h1>Receive payment</h1><div class="row"><label>Counter<input id="branch"></label><label>Customer<input id="customer"></label><label>Method<select id="method"><option>cash</option><option>upi</option><option>card</option><option>bank_transfer</option><option>cheque</option><option>other</option></select></label><label>Amount<input id="amount" type="number" min="0.01" step="0.01"></label><label>Reference<input id="reference"></label></div><button id="receive" class="orange">Record payment</button></div><div class="card"><h2>Allocate payment</h2><div class="row"><label>Payment<select id="payment"></select></label><label>Target type<select id="targetType"><option>sale</option><option>invoice</option><option>service_job</option><option>customer_account</option></select></label><label>Target ID<input id="target"></label><label>Amount<input id="allocAmount" type="number" min="0.01" step="0.01"></label></div><button id="allocate">Allocate explicitly</button></div><div id="list"></div></main><script>const key='tagro-echo-os-payments-v1';let s=JSON.parse(localStorage.getItem(key)||'{"payments":[],"allocations":[]}');const save=()=>localStorage.setItem(key,JSON.stringify(s));const id=p=>p+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16);function allocated(pid){return s.allocations.filter(x=>x.payment_id===pid).reduce((a,x)=>a+Number(x.amount),0)}function render(){payment.innerHTML=s.payments.map(x=>`<option value="${x.payment_id}">${x.payment_id} · ₹${x.amount}</option>`).join('');list.innerHTML='<h2>Payments</h2><table><tr><th>ID</th><th>Method</th><th>Amount</th><th>Allocated</th><th>Unallocated</th></tr>'+s.payments.slice().reverse().map(x=>`<tr><td>${x.payment_id}</td><td>${x.method}</td><td>₹${x.amount}</td><td>₹${allocated(x.payment_id).toFixed(2)}</td><td>₹${(Number(x.amount)-allocated(x.payment_id)).toFixed(2)}</td></tr>`).join('')+'</table>'}receive.onclick=()=>{const a=Number(amount.value);if(!branch.value.trim()||a<=0)return alert('Counter and positive amount required.');s.payments.push({payment_id:id('pay'),branch_id:branch.value.trim(),customer_id:customer.value.trim(),received_at:new Date().toISOString(),method:method.value,amount:a,reference:reference.value.trim(),actor_id:'local-user',status:'received'});save();render()};allocate.onclick=()=>{const p=s.payments.find(x=>x.payment_id===payment.value),a=Number(allocAmount.value);if(!p||!target.value.trim()||a<=0)return alert('Payment, target and amount required.');if(a>Number(p.amount)-allocated(p.payment_id))return alert('Allocation exceeds unallocated payment.');s.allocations.push({allocation_id:id('pal'),payment_id:p.payment_id,target_type:targetType.value,target_id:target.value.trim(),amount:a,allocated_at:new Date().toISOString(),actor_id:'local-user'});save();render()};render();</script></body></html>
