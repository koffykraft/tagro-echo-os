<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAGRO ECHO · Page Toolbox v2</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f5f2;color:#171717;--line:#d5d5cf;--accent:#e85d22}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:7px 10px}.top b{font-size:14px}.spacer{flex:1}button,input,select{font:inherit}.btn{min-height:36px;border:1px solid #aaa;border-radius:5px;background:#fff;padding:0 10px;font-weight:700}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.layout{max-width:1400px;margin:auto;padding:9px;display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:9px}.panel{background:#fff;border:1px solid var(--line)}.panel h2{font-size:11px;margin:0;padding:8px 9px;background:#f0efe9;border-bottom:1px solid var(--line)}.palette{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.palette button{min-height:42px}.field{padding:0 9px;margin:9px 0}.field label{display:block;font-size:10px;color:#666;margin-bottom:3px}.field input,.field select{width:100%;min-height:36px;border:1px solid #aaa;border-radius:4px;padding:6px}.canvas{padding:9px;min-height:600px}.node{border:1px solid #bbb;background:#fff;padding:9px;margin-bottom:7px}.node.selected{outline:2px solid #2575d9}.nodehead{display:flex;align-items:center;gap:6px;font-size:10px;color:#666;margin-bottom:7px}.nodehead b{font-size:12px;color:#111}.mini{width:30px;height:28px;border:1px solid #aaa;background:#fff;border-radius:4px}.preview{padding:10px;background:#fafafa;border:1px solid #ddd}.schema{margin:9px;font:11px/1.35 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:300px;overflow:auto;background:#f7f7f5;border:1px solid #ddd;padding:8px}.hint{padding:9px;font-size:10px;line-height:1.45;color:#666;border-top:1px solid var(--line)}@media(max-width:900px){.layout{display:block;padding:6px}.panel{margin-bottom:7px}.palette{grid-template-columns:repeat(4,1fr)}.canvas{min-height:340px}}@media(max-width:520px){.palette{grid-template-columns:repeat(2,1fr)}.secondary{display:none}}</style></head><body><header class="top"><b>☰ &nbsp; ECHO Page Toolbox v2</b><span id="status" style="font-size:10px;color:#666">Draft</span><span class="spacer"></span><button id="save" class="btn secondary">Save</button><button id="download" class="btn primary">Export Definition</button></header><main class="layout"><aside class="panel"><h2>OWNER TOOLBOX</h2><div id="palette" class="palette"></div><div class="field"><label>Page title</label><input id="title" value="Owner page"></div><div class="field"><label>Page ID</label><input id="pageId" value="owner-page"></div><div class="field"><label>Target</label><select id="target"><option>responsive</option><option>mobile</option><option>tablet</option><option>desktop</option></select></div><div class="field"><label>Columns</label><select id="columns"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>6</option><option>8</option><option>12</option></select></div><div class="hint">Exports canonical <b>tagro.echo.page-definition.v1</b>. Actions are declarative only. Executable code is never embedded.</div></aside><section class="panel"><h2>PAGE FLOW</h2><div id="canvas" class="canvas"></div></section><aside class="panel"><h2>SELECTED COMPONENT</h2><div id="editor"><div class="hint">Select a component.</div></div><h2>CANONICAL DEFINITION</h2><pre id="schema" class="schema"></pre></aside></main><script>(()=>{'use strict';const TYPES=['tile','button','number','text','input','search','customer_picker','item_picker','table','list','status','chart','image','tabs','drawer','action_bar','link','ai_action'];const TARGETS=['responsive','mobile','tablet','desktop'];const ACTION_PREFIXES=['','navigate:','query:','command:','ai:'];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=t=>t+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);let selected=null;let state={schema:'tagro.echo.page-definition.v1',page_id:'owner-page',title:'Owner page',target:'responsive',columns:4,version:1,components:[]};function normalizeLayout(){state.components.forEach((c,i)=>{c.y=i;c.x=Math.min(c.x,Math.max(0,state.columns-c.width));c.width=Math.min(c.width,state.columns)})}function add(kind){const c={component_id:uid(kind),kind,label:kind.replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase()),x:0,y:state.components.length,width:Math.min(kind==='table'?state.columns:1,state.columns),height:1,data_binding:null,action:null,visible_on:[],properties:{shape:'rounded'}};state.components.push(c);selected=c.component_id;dirty();render()}function dirty(){$('#status').textContent='Unsaved'}function validBinding(v){return !v||/^[A-Za-z][A-Za-z0-9_-]*(?:\.[A-Za-z0-9_-]+){0,8}$/.test(v)}function validAction(v){return !v||ACTION_PREFIXES.slice(1).some(p=>v.startsWith(p))}function validate(){if(!/^[a-z][a-z0-9-]{0,63}$/.test(state.page_id))return'Page ID must use lower-case letters, digits and hyphens.';if(!state.title.trim())return'Title is required.';if(!TARGETS.includes(state.target))return'Invalid device target.';if(state.columns<1||state.columns>24)return'Columns must be 1–24.';const ids=new Set;for(const c of state.components){if(ids.has(c.component_id))return'Duplicate component ID.';ids.add(c.component_id);if(c.x<0||c.y<0||c.width<1||c.height<1||c.x+c.width>state.columns)return'Component outside grid: '+c.component_id;if(!validBinding(c.data_binding))return'Invalid binding: '+c.data_binding;if(!validAction(c.action))return'Action must begin navigate:, query:, command: or ai:.';}return''}function move(i,d){const j=i+d;if(j<0||j>=state.components.length)return;[state.components[i],state.components[j]]=[state.components[j],state.components[i]];normalizeLayout();dirty();render()}function render(){normalizeLayout();const canvas=$('#canvas');canvas.innerHTML=state.components.length?'':'<div class="hint">Add components in the order the user should see and act. ↑/↓ changes eye and action flow.</div>';state.components.forEach((c,i)=>{const n=document.createElement('article');n.className='node'+(selected===c.component_id?' selected':'');n.innerHTML=`<div class="nodehead"><b>${esc(c.kind)}</b><span>${esc(c.data_binding||'unbound')}</span><span class="spacer"></span><button class="mini" data-up>↑</button><button class="mini" data-down>↓</button><button class="mini" data-x>×</button></div><div class="preview">${esc(c.label)}</div>`;n.onclick=e=>{if(e.target.closest('button'))return;selected=c.component_id;render()};n.querySelector('[data-up]').onclick=()=>move(i,-1);n.querySelector('[data-down]').onclick=()=>move(i,1);n.querySelector('[data-x]').onclick=()=>{state.components.splice(i,1);selected=null;normalizeLayout();dirty();render()};canvas.appendChild(n)});renderEditor();$('#schema').textContent=JSON.stringify(state,null,2)}function renderEditor(){const c=state.components.find(x=>x.component_id===selected),box=$('#editor');if(!c){box.innerHTML='<div class="hint">Select a component.</div>';return}box.innerHTML=`<div class="field"><label>Label</label><input id="label" value="${esc(c.label)}"></div><div class="field"><label>Width</label><input id="width" type="number" min="1" max="${state.columns}" value="${c.width}"></div><div class="field"><label>Height</label><input id="height" type="number" min="1" value="${c.height}"></div><div class="field"><label>Data binding</label><input id="binding" value="${esc(c.data_binding||'')}" placeholder="financial.today.sales"></div><div class="field"><label>Action</label><input id="action" value="${esc(c.action||'')}" placeholder="navigate:/billing"></div><div class="field"><label>Visible on</label><select id="visible" multiple size="4">${TARGETS.slice(1).map(t=>`<option${c.visible_on.includes(t)?' selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Shape</label><select id="shape"><option${c.properties.shape==='rounded'?' selected':''}>rounded</option><option${c.properties.shape==='square'?' selected':''}>square</option><option${c.properties.shape==='pill'?' selected':''}>pill</option></select></div><div id="err" class="hint"></div>`;['label','width','height','binding','action','visible','shape'].forEach(id=>$('#'+id).onchange=()=>{c.label=$('#label').value;c.width=Math.max(1,Math.min(state.columns,Number($('#width').value)||1));c.height=Math.max(1,Number($('#height').value)||1);c.data_binding=$('#binding').value.trim()||null;c.action=$('#action').value.trim()||null;c.visible_on=[...$('#visible').selectedOptions].map(o=>o.value);c.properties={shape:$('#shape').value};dirty();const err=validate();if(err){$('#err').textContent=err;$('#err').style.color='#b3261e'}else render()})}TYPES.forEach(t=>{const b=document.createElement('button');b.className='btn';b.textContent='+ '+t;b.onclick=()=>add(t);$('#palette').appendChild(b)});$('#title').oninput=e=>{state.title=e.target.value;dirty();render()};$('#pageId').oninput=e=>{state.page_id=e.target.value;dirty();render()};$('#target').onchange=e=>{state.target=e.target.value;dirty();render()};$('#columns').onchange=e=>{state.columns=Number(e.target.value);normalizeLayout();dirty();render()};$('#save').onclick=()=>{const err=validate();if(err){alert(err);return}localStorage.setItem('echo.page-definition.'+state.page_id,JSON.stringify(state));$('#status').textContent='Saved locally'};$('#download').onclick=()=>{const err=validate();if(err){alert(err);return}const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=state.page_id+'.page.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render()})();</script></body></html>
