<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<title>TAGRO ECHO · Closing Cash Ver05 Mobile Grid</title>
<style>
:root{--ink:#181818;--line:#222;--sale:#c8f3c8;--expense:#fff486;--cash:#d5f4d0;--grey:#d3d3d3;--focus:#56a8ff;--row:#eef6ff;--yellow:#fff349;--red:#e53935;--blue:#2368d5}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:13px}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #bbb;padding:6px}.brand{font-weight:900;font-size:18px}.meta{display:grid;grid-template-columns:1fr 78px 1.2fr;gap:4px;margin-top:5px}.meta label{font-size:9px;color:#666}.meta input,.meta select{width:100%;height:31px;border:1px solid #aaa;border-radius:3px;background:#fff;padding:2px 5px;font-size:12px}.tools{display:flex;gap:4px;margin-top:5px;overflow-x:auto;white-space:nowrap}.tools button{height:31px;border:1px solid #999;background:#fff;border-radius:3px;padding:3px 8px;font-weight:700;font-size:11px}.tools .save{background:#e85d22;color:#fff;border-color:#e85d22}.sheet{padding:5px}.grid{width:100%;border-collapse:collapse;table-layout:fixed}.grid col.sale{width:22%}.grid col.bill{width:23%}.grid col.exp{width:23%}.grid col.part{width:32%}.grid th,.grid td{border:1px solid var(--line);height:35px;padding:0}.grid th{font-size:11px;text-align:center;background:#fff}.grid th.sale,.grid td.sale{background:var(--sale)}.grid th.exp,.grid td.exp{background:var(--expense)}.grid input{width:100%;height:34px;border:0;background:transparent;padding:4px 5px;outline:0;font-size:13px}.grid input.num{text-align:right}.grid tr.active td{box-shadow:inset 0 1px var(--focus),inset 0 -1px var(--focus)}.grid input:focus{box-shadow:inset 0 0 0 2px var(--focus);background:rgba(255,255,255,.45)}.sheet-note{font-size:9px;color:#666;padding:3px 1px 5px}.lower{display:grid;grid-template-columns:1fr 1.08fr;gap:5px;margin-top:5px}.box{border:1px solid #bbb}.box h3{font-size:11px;margin:0;padding:5px 6px;border-bottom:1px solid #bbb}.denom{width:100%;border-collapse:collapse}.denom td,.denom th{border:1px solid var(--line);height:31px;padding:0}.denom th{font-size:9px;background:#eee}.denom td:first-child,.denom td:last-child{background:var(--cash);font-weight:700;padding:0 5px;text-align:right}.denom input{width:100%;height:30px;border:0;background:var(--grey);text-align:right;padding:2px 5px;outline:0;font-size:12px}.denom input:focus{box-shadow:inset 0 0 0 2px var(--focus)}.summary{display:grid;grid-template-columns:1fr 78px}.summary div{border-bottom:1px solid var(--line);padding:5px 6px;min-height:31px}.summary div:nth-child(2n){border-left:1px solid var(--line);text-align:right;font-weight:700}.summary .blue{color:var(--blue);font-weight:800}.summary .diff{background:var(--yellow);color:var(--red);font-weight:900}.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid #bbb;padding:5px;display:flex;gap:4px}.foot button{flex:1;height:34px;border:1px solid #999;background:#fff;border-radius:3px;font-weight:700}.foot .primary{background:#111;color:#fff}.hint{font-size:9px;color:#666;padding:2px 6px}
@media(max-width:390px){html,body{font-size:12px}.grid input{font-size:12px}.lower{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 66px}.grid col.sale{width:21%}.grid col.bill{width:22%}.grid col.exp{width:22%}.grid col.part{width:35%}}
</style>
</head>
<body>
<div class="top"><div class="brand">TAGRO × ECHO · Closing Cash</div><div class="meta"><label>Date<input id="date" type="date"></label><label>Branch<select id="branch"><option>KVR</option><option>PKM</option><option>NDD</option><option>MDM</option><option>SKT</option></select></label><label>Entered by<select id="person"><option>Login user</option><option>Owner</option></select></label></div><div class="tools"><button id="saleMode">SALE</button><button id="expenseMode">EXPENSE</button><button id="cashMode">CASH / OTHER</button><button id="undo">Undo</button><button class="save" id="review">Review & Save</button></div></div>
<div class="sheet"><table class="grid"><colgroup><col class="sale"><col class="bill"><col class="exp"><col class="part"></colgroup><thead><tr><th class="sale">SALE</th><th>BILL</th><th class="exp">EXPENSES</th><th>PARTICULARS</th></tr></thead><tbody id="rows"></tbody></table><div class="sheet-note">Tap once to enter. ENTER follows the current job path. Values select automatically.</div><div class="lower"><div class="box"><h3>CASH COUNT</h3><table class="denom"><thead><tr><th>Note</th><th>Qty</th><th>Amount</th></tr></thead><tbody id="denoms"></tbody></table></div><div class="box"><h3>CLOSING</h3><div class="summary" id="summary"></div></div></div></div>
<div class="hint" id="hint">Mode: SALE · Enter amount, then bill, then next row.</div><div class="foot"><button id="prev">◀ Previous</button><button class="primary" id="next">Next ▶</button></div>
<script>
const DENOMS=[500,200,100,50,20,10,'Coins'];let mode='sale',data=[],counts={500:0,200:0,100:0,50:0,20:0,10:0,Coins:0},active=null,lastAdded=null;const $=id=>document.getElementById(id);function n(v){const x=Number(String(v??'').replace(/,/g,''));return Number.isFinite(x)?x:0}function today(){const d=new Date(),p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function addRow(seed={}){const r={id:crypto.randomUUID(),sale:seed.sale||'',bill:seed.bill||'',expense:seed.expense||'',part:seed.part||''};data.push(r);lastAdded=r.id;renderRows();return r}
function renderRows(){rows.innerHTML=data.map(r=>`<tr data-row="${r.id}"><td class="sale"><input class="num" data-id="${r.id}" data-key="sale" inputmode="decimal" enterkeyhint="next" value="${r.sale}"></td><td><input data-id="${r.id}" data-key="bill" enterkeyhint="next" value="${r.bill}"></td><td class="exp"><input class="num" data-id="${r.id}" data-key="expense" inputmode="decimal" enterkeyhint="next" value="${r.expense}"></td><td><input data-id="${r.id}" data-key="part" enterkeyhint="next" value="${r.part}"></td></tr>`).join('');rows.querySelectorAll('input').forEach(bindCell);calc()}
function bindCell(el){el.addEventListener('focus',()=>{active=el;rows.querySelectorAll('tr.active').forEach(x=>x.classList.remove('active'));el.closest('tr').classList.add('active');requestAnimationFrame(()=>el.select())});el.addEventListener('click',()=>el.select());el.addEventListener('input',()=>{const r=data.find(x=>x.id===el.dataset.id);r[el.dataset.key]=el.value;calc()});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();advance(e.shiftKey?-1:1)}else if(e.key==='ArrowDown'){e.preventDefault();moveVertical(1)}else if(e.key==='ArrowUp'){e.preventDefault();moveVertical(-1)}})}
function pathFor(key){if(mode==='sale')return['sale','bill'];if(mode==='expense')return['expense','part'];return key==='sale'||key==='bill'?['sale','bill']:['expense','part']}
function advance(dir=1){if(!active){focusMode();return}const rowIndex=data.findIndex(r=>r.id===active.dataset.id),key=active.dataset.key,path=pathFor(key),p=path.indexOf(key);if(dir<0){if(p>0)return focus(data[rowIndex].id,path[p-1]);if(rowIndex>0)return focus(data[rowIndex-1].id,path[path.length-1]);return}if(p>=0&&p<path.length-1)return focus(data[rowIndex].id,path[p+1]);let next=data[rowIndex+1];if(!next)next=addRow();focus(next.id,path[0])}
function moveVertical(dir){if(!active)return;const i=data.findIndex(r=>r.id===active.dataset.id),ni=Math.max(0,Math.min(data.length-1,i+dir));focus(data[ni].id,active.dataset.key)}function focus(id,key){const el=rows.querySelector(`input[data-id="${id}"][data-key="${key}"]`);if(el){el.focus({preventScroll:true});el.select();el.scrollIntoView({block:'center'})}}
function focusMode(){if(!data.length)addRow();const key=mode==='expense'?'expense':'sale';focus(data[0].id,key)}
function setMode(m){mode=m;hint.textContent=m==='sale'?'Mode: SALE · amount → bill → next sale row.':m==='expense'?'Mode: EXPENSE · amount → particulars → next expense row.':'Mode: CASH / OTHER · use expense + particulars; Prism interprets meaning later.';focusMode()}
function renderDenoms(){denoms.innerHTML=DENOMS.map(d=>`<tr><td>${d==='Coins'?'Coins':'₹'+d}</td><td><input data-denom="${d}" inputmode="${d==='Coins'?'decimal':'numeric'}" enterkeyhint="next" value="${counts[d]}"></td><td data-amount="${d}">${d==='Coins'?counts[d]:n(d)*counts[d]}</td></tr>`).join('');const ins=[...denoms.querySelectorAll('input')];ins.forEach((el,i)=>{el.addEventListener('focus',()=>requestAnimationFrame(()=>el.select()));el.addEventListener('click',()=>el.select());el.addEventListener('input',()=>{counts[el.dataset.denom]=n(el.value);denoms.querySelector(`[data-amount="${el.dataset.denom}"]`).textContent=el.dataset.denom==='Coins'?counts[el.dataset.denom]:n(el.dataset.denom)*counts[el.dataset.denom];calc()});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();const t=ins[e.shiftKey?Math.max(0,i-1):Math.min(ins.length-1,i+1)];t.focus({preventScroll:true});t.select()}else if(e.key==='ArrowDown'){e.preventDefault();ins[Math.min(ins.length-1,i+1)].focus()}else if(e.key==='ArrowUp'){e.preventDefault();ins[Math.max(0,i-1)].focus()}})})}
function calc(){const sales=data.reduce((s,r)=>s+n(r.sale),0),expenses=data.reduce((s,r)=>s+n(r.expense),0),yesterday=n(localStorage.getItem(`echo.cc.yesterday.${branch.value}`)||0),total=yesterday+sales,balance=total-expenses,cash=DENOMS.reduce((s,d)=>s+(d==='Coins'?n(counts[d]):n(d)*n(counts[d])),0),diff=cash-balance;summary.innerHTML=`<div>Yesterday Closing</div><div>${yesterday.toFixed(2)}</div><div>Today sale</div><div>${sales.toFixed(2)}</div><div><b>TOTAL</b></div><div>${total.toFixed(2)}</div><div>Expenses</div><div>${expenses.toFixed(2)}</div><div class="blue">Balance Due</div><div class="blue">${balance.toFixed(2)}</div><div><b>CASH in hand</b></div><div>${cash.toFixed(2)}</div><div class="diff">Difference</div><div class="diff">${diff.toFixed(2)}</div>`}
date.value=today();for(let i=0;i<8;i++)addRow();renderDenoms();setMode('sale');saleMode.onclick=()=>setMode('sale');expenseMode.onclick=()=>setMode('expense');cashMode.onclick=()=>setMode('cash');next.onclick=()=>advance(1);prev.onclick=()=>advance(-1);undo.onclick=()=>{if(lastAdded&&data.length>1){data=data.filter(r=>r.id!==lastAdded);lastAdded=null;renderRows()}};review.onclick=()=>alert('Ver05 navigation prototype — save wiring follows after navigation approval.');branch.onchange=calc;
</script>
</body>
</html>
