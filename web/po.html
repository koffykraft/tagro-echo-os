<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAGRO ECHO · Purchase Order</title><link rel="stylesheet" href="styles.css"><style>.page{max-width:680px;margin:auto}.line{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:7px;margin:7px 0}.big{width:100%;min-height:54px;font-weight:700}.status{font-size:12px}</style></head><body><header><div><b>TAGRO × ECHO</b><small>Purchase Order</small></div><a class="pill" href="index.html">Home</a></header><main class="page"><div class="notice"><b>Draft → Owner approval → PO.</b> A local draft is not a supplier order.</div><section class="card"><label>Counter<input id="branch" autocomplete="off"></label><label>Supplier<input id="supplier" autocomplete="off"></label><label>Note<input id="note" autocomplete="off"></label></section><section class="card"><h2>Requirements</h2><div id="lines"></div><button id="add">+ Add item</button></section><button id="save" class="big">SAVE DRAFT FOR APPROVAL</button><div id="state" class="notice status">Nothing submitted.</div><h2>Local drafts</h2><div id="drafts"></div></main><footer>Purchase orders require owner approval before they become operational supplier instructions.</footer><script>const key='tagro-echo-po-v1';let db=JSON.parse(localStorage.getItem(key)||'{"drafts":[]}'),rows=[];const persist=()=>localStorage.setItem(key,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function addLine(v={}){rows.push({product_id:v.product_id||'',quantity:Number(v.quantity||1)});renderLines()}function renderLines(){lines.innerHTML='';rows.forEach((r,i)=>{const d=document.createElement('div');d.className='line';d.innerHTML=`<input placeholder="Product / SKU" value="${esc(r.product_id)}"><input type="number" min="0.001" step="0.001" value="${r.quantity}"><button>×</button>`;const ins=d.querySelectorAll('input');ins[0].oninput=()=>r.product_id=ins[0].value;ins[1].oninput=()=>r.quantity=Number(ins[1].value||0);d.querySelector('button').onclick=()=>{rows.splice(i,1);renderLines()};lines.appendChild(d)})}function renderDrafts(){drafts.innerHTML=db.drafts.slice().reverse().map(d=>`<div class="card"><span class="pill">${esc(d.status)}</span><b>${esc(d.branch_id)} → ${esc(d.supplier_id)}</b><p>${d.lines.map(x=>esc(x.product_id)+' × '+esc(x.quantity)).join('<br>')}</p><small>${esc(d.created_at)}</small></div>`).join('')||'<p class="muted">No drafts.</p>'}add.onclick=()=>addLine();save.onclick=()=>{const valid=rows.filter(r=>r.product_id.trim()&&r.quantity>0);if(!branch.value.trim()||!supplier.value.trim()||!valid.length){state.textContent='Counter, supplier and at least one valid item are required.';return}const d={schema:'tagro.echo.po-draft.v1',po_id:'po-'+crypto.randomUUID(),branch_id:branch.value.trim(),supplier_id:supplier.value.trim(),lines:valid.map(x=>({...x})),note:note.value.trim(),created_at:new Date().toISOString(),status:'awaiting_owner_approval',supplier_order_sent:false};db.drafts.push(d);persist();state.textContent='Draft saved. Owner approval is still required; nothing has been sent to the supplier.';rows=[];addLine();renderDrafts()};addLine();renderDrafts();</script></body></html>
