<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAGRO ECHO OS · Documents</title><link rel="stylesheet" href="styles.css"><style>@media print{header,.controls,.notice{display:none}.sheet{box-shadow:none;border:0}}</style></head><body><header><div><b>TAGRO × ECHO</b><small>Commercial documents · local prototype</small></div><a href="index.html">← OS</a></header><main><div class="notice">Deterministic local document preview. Production numbering, tax validation and persistence are not yet connected.</div><div class="card controls"><div class="row"><label>Type<select id="type"><option>quote</option><option>invoice</option><option>purchase_order</option><option>purchase</option></select></label><label>Document ID<input id="docid" value="DRAFT-001"></label><label>Counter<input id="counter" placeholder="KVR"></label><label>Party<input id="party"></label><label>Item<input id="item" placeholder="CS-620SX"></label><label>Qty<input id="qty" type="number" value="1"></label><label>Rate<input id="rate" type="number" value="0"></label><label>GST %<input id="gst" type="number" value="18"></label></div><button id="preview" class="orange">Preview</button> <button onclick="print()">Print / Save PDF</button></div><div id="sheet" class="card sheet"></div></main><script>const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=Number(qty.value||0),r=Number(rate.value||0),g=Number(gst.value||0),taxable=q*r,total=taxable*(1+g/100);sheet.innerHTML=`<h3>TAGRO × ECHO</h3><h1>${e(type.value.replace('_',' ').toUpperCase())}</h1><p><b>${e(docid.value)}</b> · ${new Date().toLocaleDateString()}</p><hr><p>Counter: ${e(counter.value)}</p><h2>${e(party.value)}</h2><table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>GST</th><th>Total</th></tr><tr><td>${e(item.value)}</td><td>${q}</td><td>₹${r.toFixed(2)}</td><td>${g}%</td><td><b>₹${total.toFixed(2)}</b></td></tr></table><h2 style="text-align:right">Grand total ₹${total.toFixed(2)}</h2>`}preview.onclick=render;render();</script></body></html>
