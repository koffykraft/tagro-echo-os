<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAGRO ECHO · Stock Count</title><link rel="stylesheet" href="styles.css"><style>.page{max-width:620px;margin:auto}.qty{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qty input{font-size:22px;min-height:58px}.big{width:100%;min-height:56px;font-weight:700}.variance{font-size:28px}.good{color:#2f6b3a}.bad{color:#9d2f2f}</style></head><body><header><div><b>TAGRO × ECHO</b><small>Stock Count</small></div><a class="pill" href="index.html">Home</a></header><main class="page"><div class="notice"><b>Count evidence only.</b> Recording a variance does not alter stock.</div><section class="card"><label>Counter<input id="branch" autocomplete="off"></label><label>Product / SKU<input id="product" autocomplete="off"></label><div class="qty"><label>System qty<input id="systemQty" type="number" step="0.001"></label><label>Counted qty<input id="countedQty" type="number" step="0.001"></label></div><div>Variance <b id="variance" class="variance">—</b></div><label>Evidence / shelf note<input id="evidence" autocomplete="off"></label><button id="record" class="big">RECORD COUNT</button><div id="state" class="muted"></div></section><h2>Session</h2><div id="session"></div></main><footer>Finalizing a count reports variances for review. Stock mutation requires a separate governed operational action.</footer><script>const key='tagro-echo-stock-count-v1';let db=JSON.parse(localStorage.getItem(key)||'{"rows":[]}');const persist=()=>localStorage.setItem(key,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function delta(){const a=Number(systemQty.value),b=Number(countedQty.value);if(!Number.isFinite(a)||!Number.isFinite(b)){variance.textContent='—';variance.className='variance';return null}const d=b-a;variance.textContent=(d>0?'+':'')+d;variance.className='variance '+(d===0?'good':'bad');return d}systemQty.oninput=countedQty.oninput=delta;function render(){session.innerHTML=db.rows.slice().reverse().map(r=>`<div class="card"><b>${esc(r.product_id)}</b><span class="pill">variance ${esc(r.variance)}</span><p>System ${esc(r.system_qty)} · Counted ${esc(r.counted_qty)}</p><small>${esc(r.branch_id)} · ${esc(r.recorded_at)}</small></div>`).join('')||'<p class="muted">No count lines recorded.</p>'}record.onclick=()=>{const d=delta();if(!branch.value.trim()||!product.value.trim()||d===null){state.textContent='Counter, product, system qty and counted qty are required.';return}const row={schema:'tagro.echo.stock-count-evidence.v1',count_line_id:'cnt-'+crypto.randomUUID(),branch_id:branch.value.trim(),product_id:product.value.trim(),system_qty:Number(systemQty.value),counted_qty:Number(countedQty.value),variance:d,evidence:evidence.value.trim(),recorded_at:new Date().toISOString(),stock_mutated:false,status:'evidence_recorded'};db.rows=db.rows.filter(x=>!(x.branch_id===row.branch_id&&x.product_id===row.product_id));db.rows.push(row);persist();localStorage.setItem('tagro-stock-count-branch',row.branch_id);state.textContent='Count evidence recorded. Stock has not been changed.';product.value='';systemQty.value='';countedQty.value='';evidence.value='';delta();render()};branch.value=localStorage.getItem('tagro-stock-count-branch')||'';render();</script></body></html>
