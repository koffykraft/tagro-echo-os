<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAGRO ECHO · Page Toolbox</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f5f2;color:#171717;--line:#d5d5cf;--accent:#e85d22}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:7px 10px}.top b{font-size:14px}.spacer{flex:1}button,input,select{font:inherit}.btn{min-height:36px;border:1px solid #aaa;border-radius:5px;background:#fff;padding:0 10px;font-weight:700}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.layout{max-width:1400px;margin:auto;padding:9px;display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:9px}.panel{background:#fff;border:1px solid var(--line)}.panel h2{font-size:11px;margin:0;padding:8px 9px;background:#f0efe9;border-bottom:1px solid var(--line)}.palette{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.palette button{min-height:42px}.field{padding:0 9px;margin:9px 0}.field label{display:block;font-size:10px;color:#666;margin-bottom:3px}.field input,.field select{width:100%;min-height:36px;border:1px solid #aaa;border-radius:4px;padding:6px}.canvas{padding:9px;min-height:600px}.node{border:1px solid #bbb;background:#fff;padding:9px;margin-bottom:7px}.node.selected{outline:2px solid #2575d9}.nodehead{display:flex;align-items:center;gap:6px;font-size:10px;color:#666;margin-bottom:7px}.nodehead b{font-size:12px;color:#111}.nodehead .spacer{flex:1}.mini{width:30px;height:28px;border:1px solid #aaa;background:#fff;border-radius:4px}.preview{padding:10px;background:#fafafa;border:1px solid #ddd}.schema{margin:9px;font:11px/1.35 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:300px;overflow:auto;background:#f7f7f5;border:1px solid #ddd;padding:8px}.hint{padding:9px;font-size:10px;line-height:1.45;color:#666;border-top:1px solid var(--line)}@media(max-width:900px){.layout{display:block;padding:6px}.panel{margin-bottom:7px}.palette{grid-template-columns:repeat(4,1fr)}.canvas{min-height:340px}}@media(max-width:520px){.palette{grid-template-columns:repeat(2,1fr)}.secondary{display:none}}</style></head><body><header class="top"><b>☰ &nbsp; ECHO Page Toolbox</b><span id="status" style="font-size:10px;color:#666">Draft</span><span class="spacer"></span><button id="save" class="btn secondary">Save</button><button id="download" class="btn primary">Export Definition</button></header><main class="layout"><aside class="panel"><h2>OWNER TOOLBOX</h2><div id="palette" class="palette"></div><div class="field"><label>Page title</label><input id="title" value="Owner page"></div><div class="field"><label>Page ID</label><input id="pageId" value="owner-page"></div><div class="field"><label>Responsive columns</label><select id="columns"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></div><div class="hint">Definitions are owner-edit-only. Bindings are admitted named paths. Consequential actions cannot be exported unless owner authority is explicitly required.</div></aside><section class="panel"><h2>PAGE FLOW</h2><div id="canvas" class="canvas"></div></section><aside class="panel"><h2>SELECTED COMPONENT</h2><div id="editor"><div class="hint">Select a component.</div></div><h2>GOVERNED DEFINITION</h2><pre id="schema" class="schema"></pre></aside></main><script>(()=>{'use strict';const TYPES=['tile','button','field','list','table','chart','link','text','heading','status'];const ACTIONS=['','navigate','open_form','submit','refresh','export','filter'];const ROOTS=['context','customer','product','stock','service','financial','document','local'];const $=s=>document.querySelector(s);let selected=null;let state={page_id:'owner-page',title:'Owner page',version:1,owner_edit_only:true,responsive_columns:4,notes:'',components:[]};const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=t=>t+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);function add(kind){const c={component_id:uid(kind),kind,label:kind[0].toUpperCase()+kind.slice(1),binding:kind==='field'?{path:'local.value',mode:'input'}:null,action:['button','link'].includes(kind)?{kind:'navigate',target:'/',requires_owner:false,consequential:false}:null,width:1,options:{}};state.components.push(c);selected=c.component_id;dirty();render()}function dirty(){$('#status').textContent='Unsaved'}function validBinding(v){return /^[a-z][a-z0-9_]*(?:\.[A-Za-z0-9_-]+){0,8}$/.test(v)&&ROOTS.includes(v.split('.')[0])}function validTarget(v){return /^[A-Za-z0-9_./?&=:%#-]{1,300}$/.test(v)}function validate(){if(!/^[a-z][a-z0-9-]{1,63}$/.test(state.page_id))return'Page ID must be lower-case letters, digits and hyphens.';for(const c of state.components){if(c.kind==='field'&&!c.binding)return'Field components require a binding.';if(['button','link'].includes(c.kind)&&!c.action)return c.kind+' requires an action.';if(c.binding&&!validBinding(c.binding.path))return'Invalid or non-admitted binding: '+c.binding.path;if(c.action){if(!ACTIONS.includes(c.action.kind)||!c.action.kind)return'Unsupported action kind.';if(!validTarget(c.action.target))return'Invalid action target.';if(c.action.consequential&&!c.action.requires_owner)return'Consequential actions must require owner authority.'}}return''}function render(){const canvas=$('#canvas');canvas.innerHTML=state.components.length?'':'<div class="hint">Add components in the same order the user should see and act. Use ↑/↓ to change eye and action flow.</div>';state.components.forEach((c,i)=>{const n=document.createElement('article');n.className='node'+(selected===c.component_id?' selected':'');n.innerHTML=`<div class="nodehead"><b>${escapeHtml(c.kind)}</b><span>${c.binding?escapeHtml(c.binding.path):'unbound'}</span><span class="spacer"></span><button class="mini" data-up>↑</button><button class="mini" data-down>↓</button><button class="mini" data-x>×</button></div><div class="preview">${escapeHtml(c.label)}</div>`;n.onclick=e=>{if(e.target.closest('button'))return;selected=c.component_id;render()};n.querySelector('[data-up]').onclick=()=>move(i,-1);n.querySelector('[data-down]').onclick=()=>move(i,1);n.querySelector('[data-x]').onclick=()=>{state.components.splice(i,1);selected=null;dirty();render()};canvas.appendChild(n)});renderEditor();$('#schema').textContent=JSON.stringify(state,null,2)}function move(i,d){const j=i+d;if(j<0||j>=state.components.length)return;[state.components[i],state.components[j]]=[state.components[j],state.components[i]];dirty();render()}function renderEditor(){const c=state.components.find(x=>x.component_id===selected),box=$('#editor');if(!c){box.innerHTML='<div class="hint">Select a component.</div>';return}const binding=c.binding||{path:'',mode:'read'},action=c.action||{kind:'',target:'',requires_owner:false,consequential:false};box.innerHTML=`<div class="field"><label>Label</label><input data-k="label" value="${escapeHtml(c.label)}"></div><div class="field"><label>Width</label><select data-k="width">${[1,2,3,4].map(x=>`<option${c.width===x?' selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Binding path</label><input id="bindPath" value="${escapeHtml(binding.path)}" placeholder="financial.sales_today"></div><div class="field"><label>Binding mode</label><select id="bindMode"><option value="read"${binding.mode==='read'?' selected':''}>read</option><option value="input"${binding.mode==='input'?' selected':''}>input</option></select></div><div class="field"><label>Action kind</label><select id="actKind">${ACTIONS.map(a=>`<option value="${a}"${action.kind===a?' selected':''}>${a||'none'}</option>`).join('')}</select></div><div class="field"><label>Action target</label><input id="actTarget" value="${escapeHtml(action.target)}"></div><div class="field"><label><input id="ownerReq" type="checkbox"${action.requires_owner?' checked':''}> Requires owner</label></div><div class="field"><label><input id="conseq" type="checkbox"${action.consequential?' checked':''}> Consequential action</label></div><div id="err" class="hint"></div>`;box.querySelector('[data-k="label"]').oninput=e=>{c.label=e.target.value;dirty();render()};box.querySelector('[data-k="width"]').onchange=e=>{c.width=Number(e.target.value);dirty();render()};['bindPath','bindMode','actKind','actTarget','ownerReq','conseq'].forEach(id=>$('#'+id).onchange=updateComplex)}function updateComplex(){const c=state.components.find(x=>x.component_id===selected);if(!c)return;const path=$('#bindPath').value.trim();c.binding=path?{path,mode:$('#bindMode').value}:null;const kind=$('#actKind').value;c.action=kind?{kind,target:$('#actTarget').value.trim(),requires_owner:$('#ownerReq').checked,consequential:$('#conseq').checked}:null;dirty();const err=validate();if(err){$('#err').textContent=err;$('#err').style.color='#b3261e'}else render()}TYPES.forEach(t=>{const b=document.createElement('button');b.textContent='+ '+t;b.className='btn';b.onclick=()=>add(t);$('#palette').appendChild(b)});$('#title').oninput=e=>{state.title=e.target.value;dirty();render()};$('#pageId').oninput=e=>{state.page_id=e.target.value;dirty();render()};$('#columns').onchange=e=>{state.responsive_columns=Number(e.target.value);state.components.forEach(c=>c.width=Math.min(c.width,state.responsive_columns));dirty();render()};$('#save').onclick=()=>{const err=validate();if(err){alert(err);return}localStorage.setItem('echo.page-definition.'+state.page_id,JSON.stringify(state));$('#status').textContent='Saved locally'};$('#download').onclick=()=>{const err=validate();if(err){alert(err);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=state.page_id+'.page.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render()})();</script></body></html>
