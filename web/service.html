<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAGRO ECHO OS · Service</title><link rel="stylesheet" href="styles.css"></head><body><header><div><b>TAGRO × ECHO · SERVICE</b><small>Local prototype</small></div><a href="index.html">← OS</a></header><main><div class="notice"><b>Service intake prototype.</b> Customer, machine, complaint and history are retained locally in this browser only.</div><div class="card"><h1>Accept machine</h1><div class="row"><label>Customer<select id="customer"></select></label><label>Counter<select id="branch"></select></label><label>Known product<select id="product"></select></label></div><div class="row"><label>Model<input id="model"></label><label>Serial<input id="serial"></label></div><label>Complaint<textarea id="complaint" rows="3"></textarea></label><div class="actions"><button class="orange" id="accept">Accept for service</button></div></div><h2>Open jobs</h2><div id="jobs"></div></main><script>const key='tagro-echo-os-prototype-v1';let s=JSON.parse(localStorage.getItem(key)||'{}');for(const n of ['customers','branches','products','machines','serviceJobs','serviceEvents'])s[n]=s[n]||[];const $=x=>document.querySelector(x),id=p=>p+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16),save=()=>localStorage.setItem(key,JSON.stringify(s));function fill(sel,arr,idf,label){$(sel).innerHTML='<option value="">Select</option>'+arr.map(x=>`<option value="${x[idf]}">${label(x)}</option>`).join('')}function render(){fill('#customer',s.customers,'customer_id',x=>x.name+' · '+x.phone);fill('#branch',s.branches,'branch_id',x=>x.code+' · '+x.name);fill('#product',s.products,'product_id',x=>x.model+' · '+x.name);$('#jobs').innerHTML=s.serviceJobs.slice().reverse().map(j=>`<div class="card"><span class="pill">${j.status}</span><h3>${j.model}${j.serial?' · '+j.serial:''}</h3><p>${j.complaint}</p><small>${j.branch_id} · ${j.opened_at}</small></div>`).join('')||'<p class="muted">No jobs yet.</p>'}$('#product').onchange=e=>{const p=s.products.find(x=>x.product_id===e.target.value);if(p)$('#model').value=p.model};$('#accept').onclick=()=>{const customer_id=$('#customer').value,branch_id=$('#branch').value,product_id=$('#product').value,model=$('#model').value.trim(),serial=$('#serial').value.trim(),complaint=$('#complaint').value.trim();if(!customer_id||!branch_id||!model||!complaint)return alert('Customer, counter, model and complaint are required.');let machine=s.machines.find(x=>serial&&x.serial_no===serial);if(!machine){machine={machine_id:id('mach'),customer_id,product_id:product_id||'',model,serial_no:serial,source:'staff_confirmed'};s.machines.push(machine)}const job={job_id:id('job'),branch_id,customer_id,machine_id:machine.machine_id,model,serial,opened_at:new Date().toISOString(),complaint,status:'received',observations:''};s.serviceJobs.push(job);s.serviceEvents.push({event_id:id('sev'),job_id:job.job_id,occurred_at:job.opened_at,event_type:'received',note:complaint});save();render();$('#complaint').value=''};render();</script></body></html>
