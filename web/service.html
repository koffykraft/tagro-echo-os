<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAGRO ECHO · Service</title><link rel="stylesheet" href="styles.css"><style>.service{max-width:680px;margin:auto}.primary label{display:block;margin:12px 0}.primary select,.primary input,.primary textarea{font-size:18px;min-height:50px}.accept{width:100%;min-height:58px;font-size:18px;font-weight:700}.branch-chip{font-size:12px}.jobs .card{padding:12px}.more summary{cursor:pointer;padding:10px 0;font-weight:600}</style></head><body><header><div><b>TAGRO × ECHO · SERVICE</b><small>Quick intake</small></div><a class="pill" href="index.html">Home</a></header><main class="service"><div class="notice"><b>Customer → Machine → Complaint → Accept.</b> Additional details stay out of the way until needed.</div><div class="card primary"><h1>Accept machine</h1><label>Customer<select id="customer"></select></label><label>Machine<input id="model" placeholder="e.g. MS 382 / FS 120" autocomplete="off"></label><label>Complaint<textarea id="complaint" rows="3" placeholder="What is wrong?"></textarea></label><details id="more" class="more"><summary>More details</summary><label>Counter <select id="branch"></select></label><label>Known product <select id="product"></select></label><label>Serial <input id="serial" autocomplete="off"></label></details><button class="orange accept" id="accept">ACCEPT</button><div id="branchState" class="muted branch-chip"></div></div><h2>Open jobs</h2><div id="jobs" class="jobs"></div></main><footer>Service intake is local/offline until synchronization is confirmed. Existing machine and job history remain preserved.</footer><script>const key='tagro-echo-os-prototype-v1';let s=JSON.parse(localStorage.getItem(key)||'{}');for(const n of ['customers','branches','products','machines','serviceJobs','serviceEvents'])s[n]=s[n]||[];const $=x=>document.querySelector(x),id=p=>p+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16),save=()=>localStorage.setItem(key,JSON.stringify(s));function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fill(sel,arr,idf,label){$(sel).innerHTML='<option value="">Select</option>'+arr.map(x=>`<option value="${esc(x[idf])}">${esc(label(x))}</option>`).join('')}function rememberBranch(){if($('#branch').value)localStorage.setItem('tagro-service-branch',$('#branch').value);branchState.textContent=$('#branch').value?'Counter: '+($('#branch').selectedOptions[0]?.textContent||$('#branch').value):'Counter not selected · open More details'}function render(){fill('#customer',s.customers,'customer_id',x=>x.name+' · '+x.phone);fill('#branch',s.branches,'branch_id',x=>x.code+' · '+x.name);fill('#product',s.products,'product_id',x=>x.model+' · '+x.name);const remembered=localStorage.getItem('tagro-service-branch');if(remembered&&s.branches.some(x=>x.branch_id===remembered))$('#branch').value=remembered;else if(s.branches.length===1)$('#branch').value=s.branches[0].branch_id;rememberBranch();$('#jobs').innerHTML=s.serviceJobs.slice().reverse().map(j=>`<div class="card"><span class="pill">${esc(j.status)}</span><h3>${esc(j.model)}${j.serial?' · '+esc(j.serial):''}</h3><p>${esc(j.complaint)}</p><small>${esc(j.branch_id)} · ${esc(j.opened_at)}</small></div>`).join('')||'<p class="muted">No jobs yet.</p>'}$('#branch').onchange=rememberBranch;$('#product').onchange=e=>{const p=s.products.find(x=>x.product_id===e.target.value);if(p)$('#model').value=p.model};$('#accept').onclick=()=>{const customer_id=$('#customer').value,branch_id=$('#branch').value,product_id=$('#product').value,model=$('#model').value.trim(),serial=$('#serial').value.trim(),complaint=$('#complaint').value.trim();if(!customer_id||!model||!complaint){alert('Customer, machine and complaint are required.');return}if(!branch_id){$('#more').open=true;alert('Select the counter once; ECHO will remember it on this device.');return}let machine=s.machines.find(x=>serial&&x.serial_no===serial);if(!machine){machine={machine_id:id('mach'),customer_id,product_id:product_id||'',model,serial_no:serial,source:'staff_confirmed'};s.machines.push(machine)}const job={job_id:id('job'),branch_id,customer_id,machine_id:machine.machine_id,model,serial,opened_at:new Date().toISOString(),complaint,status:'received',observations:''};s.serviceJobs.push(job);s.serviceEvents.push({event_id:id('sev'),job_id:job.job_id,occurred_at:job.opened_at,event_type:'received',note:complaint});save();render();$('#complaint').value='';$('#serial').value='';$('#model').value=''};render();</script></body></html>
