<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4f1"><title>Sign in · TAGRO ECHO</title><link rel="stylesheet" href="operation.css"><style>.login-wrap{min-height:100vh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) var(--safe-r) max(24px,env(safe-area-inset-bottom)) var(--safe-l)}.login-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 16px 44px rgba(25,21,16,.08)}.login-logo{display:block;width:min(260px,72vw);margin:0 auto 22px}.login-logo img{display:block;width:100%;height:auto}.login-card h1{font-size:27px;margin:0}.login-card>p{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 16px}.hidden{display:none!important}.login-card .action{width:100%;margin-top:8px}.login-status{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--soft);font-size:12px;color:#5c5852}</style></head><body><main class="login-wrap"><section class="login-card"><picture class="login-logo"><source media="(max-width:560px)" srcset="assets/brand/tagro-echo-mobile.png"><img src="assets/brand/tagro-echo-desktop.png" alt="TAGRO ECHO"></picture><h1>Sign in</h1><p>Your secure ECHO identity resolves enterprise, role and capabilities after Cognito authentication.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div id="newPasswordBox" class="hidden"><div class="field"><label>New password</label><input id="newPassword" type="password" autocomplete="new-password"></div></div><div id="enterpriseBox" class="hidden"><div class="field"><label>Enterprise</label><select id="enterprise"></select></div></div><button id="signIn" class="action primary" type="button">SIGN IN</button><div id="status" class="login-status">Not signed in.</div></section></main><script src="runtime-config.js"></script><script src="runtime-client.js"></script><script>(()=>{'use strict';let challenge=null;const $=id=>document.getElementById(id);function message(t){$('status').textContent=t}async function finishContext(){const ctx=await EchoRuntime.loadContext(),ents=ctx.enterprises||[];if(!ents.length)throw new Error('This identity has no active ECHO enterprise membership.');if(ents.length===1){EchoRuntime.chooseEnterprise(ents[0].enterprise_id);location.href='index.html';return}$('enterprise').innerHTML=ents.map(x=>`<option value="${x.enterprise_id}">${x.enterprise_code} · ${x.enterprise_name} · ${x.role_code}</option>`).join('');$('enterpriseBox').classList.remove('hidden');$('signIn').textContent='ENTER ECHO';$('signIn').disabled=false;challenge={chooseEnterprise:true}}$('signIn').onclick=async()=>{try{$('signIn').disabled=true;if(challenge?.chooseEnterprise){EchoRuntime.chooseEnterprise($('enterprise').value);location.href='index.html';return}if(challenge?.name==='NEW_PASSWORD_REQUIRED'){const np=$('newPassword').value;if(!np)throw new Error('Enter the new password.');message('Completing secure password change…');await EchoRuntime.completeNewPassword({username:challenge.username,newPassword:np,challengeSession:challenge.session});challenge=null;await finishContext();return}message('Signing in…');const result=await EchoRuntime.login($('email').value,$('password').value);$('password').value='';if(result.challenge){if(result.challenge!=='NEW_PASSWORD_REQUIRED')throw new Error('Authentication requires '+result.challenge+', which is not enabled on this device yet.');challenge={name:result.challenge,username:result.username,session:result.session};$('newPasswordBox').classList.remove('hidden');$('signIn').textContent='SET PASSWORD & SIGN IN';message('Choose a new permanent password.');$('signIn').disabled=false;return}await finishContext()}catch(e){message(e.message);$('signIn').disabled=false}};if(EchoRuntime.sessionInfo().signedIn){message('Secure session found. Resolving ECHO access…');finishContext().catch(e=>{message(e.message);$('signIn').disabled=false})}})();</script></body></html>
