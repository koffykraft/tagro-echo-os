<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>ECHO Sign in · TAGRO</title><link rel="stylesheet" href="styles.css"><style>.login{max-width:480px;margin:8vh auto}.login input,.login select,.login button{min-height:50px;font-size:17px}.login button{width:100%;font-weight:700}.hidden{display:none}.status{margin-top:12px}</style></head><body><header><div><b>TAGRO × ECHO</b><small>Staff sign in</small></div></header><main class="login"><section class="card"><h1>Sign in</h1><p class="muted">Your password goes directly to Amazon Cognito over HTTPS. ECHO does not save it.</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><div id="newPasswordBox" class="hidden"><label>New password<input id="newPassword" type="password" autocomplete="new-password"></label></div><div id="enterpriseBox" class="hidden"><label>Enterprise<select id="enterprise"></select></label></div><button id="signIn" class="orange">SIGN IN</button><div id="status" class="notice status">Not signed in.</div></section></main><script src="runtime-config.js"></script><script src="runtime-client.js"></script><script>
let challenge=null;const $=id=>document.getElementById(id);
function message(text){$('status').textContent=text}
async function finishContext(){const ctx=await EchoRuntime.loadContext(),ents=ctx.enterprises||[];if(!ents.length)throw new Error('This identity has no active ECHO enterprise membership.');if(ents.length===1){EchoRuntime.chooseEnterprise(ents[0].enterprise_id);location.href='index.html';return}$('enterprise').innerHTML=ents.map(x=>`<option value="${x.enterprise_id}">${x.enterprise_code} · ${x.enterprise_name} · ${x.role_code}</option>`).join('');$('enterpriseBox').classList.remove('hidden');$('signIn').textContent='ENTER ECHO';$('signIn').disabled=false;challenge={chooseEnterprise:true}}
$('signIn').onclick=async()=>{try{$('signIn').disabled=true;if(challenge?.chooseEnterprise){EchoRuntime.chooseEnterprise($('enterprise').value);location.href='index.html';return}if(challenge?.name==='NEW_PASSWORD_REQUIRED'){const np=$('newPassword').value;if(!np)throw new Error('Enter the new password.');message('Completing secure password change…');await EchoRuntime.completeNewPassword({username:challenge.username,newPassword:np,challengeSession:challenge.session});challenge=null;await finishContext();return}message('Authenticating…');const result=await EchoRuntime.login($('email').value,$('password').value);$('password').value='';if(result.challenge){if(result.challenge!=='NEW_PASSWORD_REQUIRED')throw new Error('Authentication requires '+result.challenge+', which is not yet enabled on this device.');challenge={name:result.challenge,username:result.username,session:result.session};$('newPasswordBox').classList.remove('hidden');$('signIn').textContent='SET PASSWORD & SIGN IN';message('A new permanent password is required.');$('signIn').disabled=false;return}await finishContext()}catch(e){message(e.message);$('signIn').disabled=false}};
if(EchoRuntime.sessionInfo().signedIn){message('Existing secure session found. Resolving ECHO access…');finishContext().catch(e=>{message(e.message);$('signIn').disabled=false})}
</script></body></html>
