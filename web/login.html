<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f1">
  <title>Sign in · TAGRO STIHL</title>
  <link rel="stylesheet" href="operation.css">
  <style>
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) var(--safe-r) max(24px,env(safe-area-inset-bottom)) var(--safe-l)}
    .login-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 16px 44px rgba(25,21,16,.08)}
    .login-logo{display:block;width:min(320px,82vw);margin:0 auto 24px}.login-logo img{display:block;width:100%;height:auto}
    .login-card h1{font-size:27px;margin:0}.login-card>p{color:var(--muted);font-size:14px;line-height:1.5;margin:6px 0 18px}
    .hidden{display:none!important}.login-card .action{width:100%;margin-top:8px}
    .login-status{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--soft);font-size:13px;color:#5c5852}
  </style>
</head>
<body>
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="signInTitle">
      <picture class="login-logo"><source media="(min-width:700px)" srcset="assets/brand/tagro-stihl-1600x400.png"><img src="assets/brand/tagro-stihl-900x240.png" alt="TAGRO STIHL"></picture>
      <h1 id="signInTitle">Sign in</h1>
      <p>Continue to your TAGRO STIHL workspace on ECHO.</p>
      <form id="signInForm">
        <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <div id="newPasswordBox" class="hidden"><div class="field"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password"></div></div>
        <div id="enterpriseBox" class="hidden"><div class="field"><label for="enterprise">Workspace</label><select id="enterprise" name="enterprise"></select></div></div>
        <button id="signIn" class="action primary" type="submit">SIGN IN</button>
      </form>
      <div id="status" class="login-status" role="status" aria-live="polite">Enter your work email and password.</div>
    </section>
  </main>
  <script src="runtime-config.js"></script>
  <script src="runtime-client.js"></script>
  <script>
  (()=>{'use strict';
    let challenge=null;
    const $=id=>document.getElementById(id);
    const form=$('signInForm'),email=$('email'),password=$('password'),newPassword=$('newPassword'),enterprise=$('enterprise'),button=$('signIn');
    function message(text){$('status').textContent=text}
    function setStep(step){
      const choosing=step==='enterprise',changing=step==='password';
      email.disabled=choosing||changing;
      password.disabled=choosing||changing;
      password.required=!choosing&&!changing;
      newPassword.required=changing;
      enterprise.required=choosing;
      if(changing)newPassword.focus();
      if(choosing)enterprise.focus();
    }
    async function finishContext(){
      const ctx=await EchoRuntime.loadContext(),memberships=ctx.enterprises||[];
      if(!memberships.length)throw new Error('Your account has no active TAGRO workspace.');
      if(memberships.length===1){EchoRuntime.chooseEnterprise(memberships[0].enterprise_id);location.href='index.html';return}
      enterprise.innerHTML=memberships.map(x=>`<option value="${x.enterprise_id}">${x.enterprise_code} · ${x.enterprise_name} · ${x.role_code}</option>`).join('');
      $('enterpriseBox').classList.remove('hidden');
      button.textContent='OPEN WORKSPACE';
      button.disabled=false;
      challenge={chooseEnterprise:true};
      setStep('enterprise');
    }
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      try{
        button.disabled=true;
        if(challenge?.chooseEnterprise){EchoRuntime.chooseEnterprise(enterprise.value);location.href='index.html';return}
        if(challenge?.name==='NEW_PASSWORD_REQUIRED'){
          if(!newPassword.value)throw new Error('Enter the new password.');
          message('Saving your new password…');
          await EchoRuntime.completeNewPassword({username:challenge.username,newPassword:newPassword.value,challengeSession:challenge.session});
          challenge=null;
          await finishContext();
          return;
        }
        message('Signing in…');
        const result=await EchoRuntime.login(email.value,password.value);
        password.value='';
        if(result.challenge){
          if(result.challenge!=='NEW_PASSWORD_REQUIRED')throw new Error('This account needs an additional sign-in step that is not available on this device.');
          challenge={name:result.challenge,username:result.username,session:result.session};
          $('newPasswordBox').classList.remove('hidden');
          button.textContent='SAVE PASSWORD & SIGN IN';
          button.disabled=false;
          setStep('password');
          message('Choose a new permanent password.');
          return;
        }
        await finishContext();
      }catch(error){
        message(error.message);
        button.disabled=false;
      }
    });
    if(EchoRuntime.sessionInfo().signedIn){
      message('Signed-in session found. Opening your workspace…');
      finishContext().catch(error=>{message(error.message);button.disabled=false});
    }
  })();
  </script>
</body>
</html>
